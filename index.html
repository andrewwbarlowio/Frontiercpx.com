<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#07172e">
  <meta name="description" content="Frontier Capital Partners. Cross the frontier. Funding your ambition. Our new website is coming soon.">
  <title>Frontier Capital Partners | Coming soon</title>
  <style>
    :root { color-scheme: dark; font-family: Arial, Helvetica, sans-serif; background: #07172e; color: #fff; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; min-height: 100svh; background: radial-gradient(ellipse at 90% 15%, #124b7b 0, transparent 55%), linear-gradient(145deg, #07172e, #0b2342); }
    main { min-height: 100vh; min-height: 100svh; max-width: 1440px; margin: auto; padding: clamp(28px, 6vw, 88px); display: flex; flex-direction: column; justify-content: space-between; gap: 80px; }
    .brand { font-size: 18px; font-weight: 700; letter-spacing: .14em; line-height: 1.6; text-transform: uppercase; }
    .brand span { display: block; font-size: 11px; font-weight: 400; letter-spacing: .25em; color: #b9cbe0; }
    section { max-width: 960px; padding: 32px 0; }
    .eyebrow { color: #8cceff; font-size: 12px; font-weight: 700; letter-spacing: .2em; text-transform: uppercase; }
    h1 { font-size: clamp(48px, 9vw, 116px); line-height: 1.02; letter-spacing: -.055em; margin: 28px 0; font-weight: 600; }
    .tagline { font-size: clamp(22px, 3vw, 36px); line-height: 1.35; color: #c6d9ed; margin: 0; }
    footer { border-top: 1px solid #ffffff26; padding-top: 24px; color: #a9bfd5; font-size: 14px; line-height: 1.6; }
    @media (max-width: 480px) { main { gap: 48px; } .brand { font-size: 16px; } }
  </style>
</head>
<body>
  <main>
    <header class="brand" aria-label="Frontier Capital Partners">Frontier<span>Capital Partners</span></header>
    <section aria-labelledby="headline">
      <p class="eyebrow">New website coming soon</p>
      <h1 id="headline">Cross the frontier.</h1>
      <p class="tagline">Funding your ambition.</p>
    </section>
    <footer>Frontier Capital Partners</footer>
  </main>
</body>
</html>
